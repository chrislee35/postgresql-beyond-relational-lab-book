<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4A7FA8"/>
      <stop offset="100%" stop-color="#C8DFF0"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3A7CA5"/>
      <stop offset="100%" stop-color="#1C4F6E"/>
    </linearGradient>
    <linearGradient id="hullOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#C8844A"/>
      <stop offset="100%" stop-color="#8B5830"/>
    </linearGradient>
    <linearGradient id="hullInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7A4E28"/>
      <stop offset="100%" stop-color="#5C3A1C"/>
    </linearGradient>
    <linearGradient id="sunGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%"
                    gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#FFF0A0"/>
      <stop offset="100%" stop-color="#F5C842"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- ░░ SKY ░░ -->
  <rect width="800" height="560" fill="url(#skyGrad)"/>

  <!-- Sun halo -->
  <circle cx="88" cy="108" r="62" fill="#F5E080" opacity="0.18"/>
  <circle cx="88" cy="108" r="44" fill="#F8EC90" opacity="0.30"/>
  <!-- Sun disc -->
  <circle cx="88" cy="108" r="30" fill="#FFF0A0" filter="url(#glow)"/>

  <!-- Clouds -->
  <g fill="white">
    <!-- Cloud 1 -->
    <ellipse cx="230" cy="88"  rx="75" ry="26" opacity="0.90"/>
    <ellipse cx="268" cy="74"  rx="52" ry="22" opacity="0.90"/>
    <ellipse cx="192" cy="96"  rx="44" ry="18" opacity="0.80"/>
    <!-- Cloud 2 -->
    <ellipse cx="520" cy="112" rx="60" ry="22" opacity="0.80"/>
    <ellipse cx="558" cy="100" rx="46" ry="19" opacity="0.80"/>
    <ellipse cx="490" cy="120" rx="36" ry="15" opacity="0.75"/>
    <!-- Cloud 3 (small, distant) -->
    <ellipse cx="660" cy="145" rx="38" ry="14" opacity="0.60"/>
    <ellipse cx="688" cy="138" rx="28" ry="12" opacity="0.60"/>
  </g>

  <!-- ░░ DISTANT TOWN SILHOUETTE ░░ -->
  <g fill="#5A7A6A" opacity="0.45" filter="url(#softBlur)">
    <!-- Rolling hills -->
    <ellipse cx="160" cy="300" rx="200" ry="55"/>
    <ellipse cx="540" cy="305" rx="240" ry="50"/>
    <ellipse cx="760" cy="295" rx="120" ry="45"/>
  </g>

  <!-- Town buildings (hazy, background) -->
  <g opacity="0.55">
    <!-- Row of buildings left -->
    <rect x="82"  y="274" width="30" height="34" fill="#C8BCA8"/>
    <polygon points="82,274 112,274 97,256"     fill="#B04040"/>
    <rect x="118" y="268" width="24" height="40" fill="#D0C8B4"/>
    <polygon points="118,268 142,268 130,250"   fill="#A03030"/>
    <rect x="148" y="278" width="28" height="30" fill="#C4BSAA"/>
    <polygon points="148,278 176,278 162,263"   fill="#B84040"/>
    <rect x="182" y="272" width="20" height="36" fill="#D4CCB8"/>
    <polygon points="182,272 202,272 192,256"   fill="#A83838"/>
    <!-- A few windows -->
    <rect x="88"  y="280" width="6" height="6" fill="#E8D890" opacity="0.7"/>
    <rect x="100" y="280" width="6" height="6" fill="#E8D890" opacity="0.5"/>
    <rect x="124" y="274" width="5" height="5" fill="#E8D890" opacity="0.6"/>
    <rect x="134" y="274" width="5" height="5" fill="#E8D890" opacity="0.4"/>
  </g>

  <!-- Lighthouse (right background) -->
  <g opacity="0.70">
    <rect x="692" y="240" width="20" height="68" fill="#E0D8C8"/>
    <!-- Stripes -->
    <rect x="692" y="255" width="20" height="10" fill="#C04040" opacity="0.7"/>
    <rect x="692" y="275" width="20" height="10" fill="#C04040" opacity="0.7"/>
    <!-- Lantern room -->
    <rect x="689" y="232" width="26" height="12" fill="#B0A890"/>
    <polygon points="689,232 715,232 702,218"   fill="#C04040"/>
    <!-- Light glow -->
    <circle cx="702" cy="225" r="8" fill="#FFEE88" opacity="0.5" filter="url(#glow)"/>
    <!-- Base -->
    <rect x="686" y="308" width="32" height="6"  fill="#B8B0A0"/>
    <rect x="682" y="314" width="40" height="4"  fill="#A8A098"/>
  </g>

  <!-- ░░ WATER ░░ -->
  <rect x="0" y="308" width="800" height="252" fill="url(#waterGrad)"/>
  <!-- Horizon shimmer -->
  <line x1="0" y1="308" x2="800" y2="308" stroke="#6AADCC" stroke-width="1.5" opacity="0.6"/>

  <!-- Sun path on water -->
  <ellipse cx="105" cy="380" rx="60" ry="18" fill="#F5E080" opacity="0.10"/>
  <ellipse cx="105" cy="340" rx="18" ry="25" fill="#F5E080" opacity="0.08"/>

  <!-- Water ripple lines -->
  <g stroke="#4A8FB8" stroke-width="1" fill="none" opacity="0.35">
    <path d="M 30,328  Q  90,323  150,328 Q 210,333  270,328"/>
    <path d="M320,342  Q 390,337  460,342 Q 520,347  580,342"/>
    <path d="M 60,362  Q 140,357  220,362 Q 300,367  380,362"/>
    <path d="M440,375  Q 530,370  620,375 Q 690,380  760,375"/>
    <path d="M 20,400  Q 120,395  220,400 Q 340,405  460,400"/>
    <path d="M520,418  Q 610,413  700,418"/>
    <path d="M 80,448  Q 200,443  320,448 Q 440,453  540,448"/>
    <path d="M600,462  Q 680,457  760,462"/>
  </g>

  <!-- ░░ SHORE ░░ -->
  <path d="M0,308 Q18,304 36,310 Q50,315 60,312 L60,560 L0,560 Z" fill="#8A7050"/>
  <!-- Shore detail -->
  <path d="M0,310 Q18,308 36,313 Q50,318 60,315" stroke="#A08060" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- ░░ DOCK PILINGS ░░ -->
  <g fill="#5C4228">
    <!-- Left piling pair (at shore) -->
    <rect x="55"  y="313" width="9"  height="247" rx="2"/>
    <rect x="68"  y="315" width="9"  height="245" rx="2"/>
    <!-- Middle piling pair -->
    <rect x="228" y="318" width="9"  height="242" rx="2"/>
    <rect x="241" y="319" width="9"  height="241" rx="2"/>
    <!-- Far piling pair -->
    <rect x="432" y="320" width="9"  height="240" rx="2"/>
    <rect x="445" y="321" width="9"  height="239" rx="2"/>
    <!-- End piling pair -->
    <rect x="560" y="322" width="9"  height="238" rx="2"/>
    <rect x="573" y="322" width="9"  height="238" rx="2"/>
  </g>
  <!-- Piling cross-braces -->
  <g stroke="#5C4228" stroke-width="4" opacity="0.7">
    <line x1="62"  y1="380" x2="240" y2="388"/>
    <line x1="62"  y1="430" x2="240" y2="438"/>
    <line x1="240" y1="388" x2="440" y2="394"/>
    <line x1="240" y1="438" x2="440" y2="444"/>
    <line x1="440" y1="394" x2="565" y2="398"/>
    <line x1="440" y1="444" x2="565" y2="448"/>
  </g>

  <!-- ░░ DOCK DECKING ░░ -->
  <!-- Main deck surface -->
  <rect x="55" y="310" width="530" height="20" fill="#9C7242" rx="2"/>
  <!-- Plank lines -->
  <g stroke="#7A5830" stroke-width="1.5" opacity="0.55">
    <line x1="80"  y1="310" x2="80"  y2="330"/>
    <line x1="108" y1="310" x2="108" y2="330"/>
    <line x1="136" y1="310" x2="136" y2="330"/>
    <line x1="164" y1="310" x2="164" y2="330"/>
    <line x1="192" y1="310" x2="192" y2="330"/>
    <line x1="256" y1="310" x2="256" y2="330"/>
    <line x1="284" y1="310" x2="284" y2="330"/>
    <line x1="312" y1="310" x2="312" y2="330"/>
    <line x1="340" y1="310" x2="340" y2="330"/>
    <line x1="368" y1="310" x2="368" y2="330"/>
    <line x1="396" y1="310" x2="396" y2="330"/>
    <line x1="460" y1="310" x2="460" y2="330"/>
    <line x1="488" y1="310" x2="488" y2="330"/>
    <line x1="516" y1="310" x2="516" y2="330"/>
    <line x1="544" y1="310" x2="544" y2="330"/>
  </g>
  <!-- Deck highlight (top edge) -->
  <line x1="55" y1="311" x2="585" y2="311" stroke="#C8A060" stroke-width="1.5" opacity="0.5"/>

  <!-- Dock end cap -->
  <rect x="578" y="308" width="7" height="24" fill="#7A5830" rx="1"/>

  <!-- Cleats on dock -->
  <!-- Cleat near boat -->
  <g fill="#909090">
    <rect x="268" y="307" width="14" height="5"  rx="1"/>
    <rect x="264" y="309" width="5"  height="4"  rx="1"/>
    <rect x="277" y="309" width="5"  height="4"  rx="1"/>
  </g>
  <!-- Second cleat -->
  <g fill="#888888">
    <rect x="460" y="307" width="14" height="5"  rx="1"/>
    <rect x="456" y="309" width="5"  height="4"  rx="1"/>
    <rect x="469" y="309" width="5"  height="4"  rx="1"/>
  </g>

  <!-- ░░ ROWBOAT ░░ -->
  <!-- Boat shadow on water -->
  <ellipse cx="300" cy="420" rx="95" ry="12" fill="#1A4A6A" opacity="0.35"/>

  <!-- Hull outer (port/left side visible) -->
  <path d="
    M 190,330
    Q 185,345  184,368
    Q 183,392  192,408
    Q 215,425  280,430
    Q 345,434  385,426
    Q 410,418  415,408
    Q 422,392  418,368
    Q 415,345  408,330
    Q 350,322  300,320
    Q 248,318  190,330 Z"
    fill="url(#hullOuter)" stroke="#7A4820" stroke-width="2"/>

  <!-- Hull inner (cockpit) -->
  <path d="
    M 202,334
    Q 198,350  197,372
    Q 196,394  204,408
    Q 225,420  280,425
    Q 338,428  374,420
    Q 396,412  400,400
    Q 406,385  403,366
    Q 400,348  395,334
    Q 346,328  300,327
    Q 252,326  202,334 Z"
    fill="url(#hullInner)"/>

  <!-- Bilge water (small puddle at bottom of cockpit) -->
  <ellipse cx="300" cy="418" rx="60" ry="5" fill="#2A5C78" opacity="0.4"/>

  <!-- Thwarts (seats) -->
  <rect x="215" y="365" width="175" height="9" fill="#A07840" rx="2" stroke="#7A5820" stroke-width="1"/>
  <rect x="228" y="344" width="155" height="9" fill="#9A7438" rx="2" stroke="#7A5820" stroke-width="1"/>
  <!-- Seat support -->
  <rect x="290" y="354" width="10" height="12" fill="#8A6430" rx="1"/>

  <!-- Oarlocks (tholepins) -->
  <circle cx="210" cy="348" r="4" fill="#7A7A7A" stroke="#555" stroke-width="1"/>
  <circle cx="400" cy="348" r="4" fill="#7A7A7A" stroke="#555" stroke-width="1"/>

  <!-- Oars (resting in boat, crossed slightly) -->
  <line x1="208" y1="348" x2="420" y2="338" stroke="#9A7240" stroke-width="5" stroke-linecap="round"/>
  <line x1="402" y1="348" x2="182" y2="338" stroke="#9A7240" stroke-width="5" stroke-linecap="round"/>
  <!-- Oar blades -->
  <ellipse cx="428" cy="337" rx="14" ry="5" fill="#8A6230" transform="rotate(-3 428 337)"/>
  <ellipse cx="174" cy="337" rx="14" ry="5" fill="#8A6230" transform="rotate(3 174 337)"/>

  <!-- Small detail: bow eye / painter ring -->
  <circle cx="192" cy="370" r="4" fill="none" stroke="#888" stroke-width="2"/>

  <!-- Gunwale highlight -->
  <path d="M 192,331 Q 300,322 408,331" stroke="#D89858" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- ░░ MOORING ROPE ░░ -->
  <!-- Rope from bow ring to dock cleat -->
  <path d="M 192,370 Q 200,355 220,338 Q 245,325 270,320 Q 272,313 270,312"
        stroke="#C8A860" stroke-width="2.5" fill="none" stroke-dasharray="4,2" stroke-linecap="round"/>
  <!-- Rope coil on dock -->
  <ellipse cx="271" cy="317" rx="6" ry="3" fill="none" stroke="#C8A860" stroke-width="2"/>

  <!-- Water reflection of boat (distorted) -->
  <path d="M 185,432 Q 240,445 300,448 Q 360,450 415,440 Q 420,435 415,432"
        stroke="#2A6888" stroke-width="1.5" fill="none" opacity="0.30"/>
  <path d="M 200,440 Q 255,450 300,452 Q 350,453 395,445"
        stroke="#2A6888" stroke-width="1"   fill="none" opacity="0.18"/>

  <!-- ░░ SEAGULLS ░░ -->
  <g stroke="#445566" stroke-width="1.8" fill="none">
    <!-- Near gulls -->
    <path d="M 490,268 Q 498,262 506,268"/>
    <path d="M 510,252 Q 520,245 530,252"/>
    <!-- Distant gulls (smaller) -->
    <path d="M 610,230 Q 616,226 622,230"/>
    <path d="M 630,218 Q 635,214 640,218"/>
    <path d="M 595,242 Q 600,238 605,242"/>
  </g>

  <!-- ░░ SMALL FISHING BUOY (detail) ░░ -->
  <ellipse cx="540" cy="370" rx="8" ry="11" fill="#C03030" stroke="#901010" stroke-width="1.5"/>
  <rect    cx="540" cy="358" x="539" y="358" width="2" height="8" fill="#888"/>
  <ellipse cx="540" cy="382" rx="8" ry="3" fill="#902020" opacity="0.5"/>

  <!-- ░░ TITLE BAR ░░ -->
  <rect x="0" y="490" width="800" height="70" fill="#152638" opacity="0.82"/>
  <!-- Thin gold rule top of bar -->
  <line x1="40" y1="491" x2="760" y2="491" stroke="#C8A840" stroke-width="1.5" opacity="0.7"/>
  <!-- Title -->
  <text x="400" y="522"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="24"
        font-weight="bold"
        fill="#F0E8D0"
        text-anchor="middle"
        letter-spacing="4">THE PORTSMITH PAPERS</text>
  <!-- Subtitle -->
  <text x="400" y="546"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="11"
        fill="#98B8C8"
        text-anchor="middle"
        letter-spacing="1.5">A HANDS-ON TOUR OF POSTGRESQL BEYOND THE RELATIONAL MODEL</text>
  <!-- Thin gold rule bottom of bar -->
  <line x1="40" y1="557" x2="760" y2="557" stroke="#C8A840" stroke-width="1" opacity="0.5"/>
</svg>
